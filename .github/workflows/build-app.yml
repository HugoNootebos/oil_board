# Builds the OIL app for Mac, Windows and Linux (packaging/build.py) and puts
# it in a GitHub Release. Runs on every push to Master, so whoever downloads
# the app gets the latest game in it; also by hand on GitHub: Actions >
# "Build app" > Run workflow. Players who already have the app get new
# versions of the game through the Update button in the main menu.
name: Build app

on:
  push:
    branches: [Master]
  workflow_dispatch:

# A newer push replaces a build still running, so the newest release is
# always the latest game.
concurrency:
  group: build-app
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install certifi
      - run: python packaging/build.py mac-arm64 mac-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install certifi pillow
      - run: python packaging/build.py windows
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\oil_installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/OIL-Setup.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install certifi
      - run: python packaging/build.py linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/OIL-linux.tar.gz

  release:
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "app-${{ github.run_number }}" dist/*
          --target "${{ github.sha }}"
          --title "OIL app (build ${{ github.run_number }})"
          --notes-file packaging/release_notes.md
